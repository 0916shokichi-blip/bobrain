name: CI

on:
  push:
    branches: [main]
  pull_request:

# Tests that need the multilingual-e5-large ONNX weights (~2.2 GB) — namely
# tests/test_mcp_client.py and tests/test_watch.py — are excluded here. They
# stay valuable as local pre-push checks but are too heavy for hosted runners.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Run lightweight tests
        run: uv run pytest tests/test_indexer.py tests/test_tokenize.py tests/test_stats.py tests/test_sanitize.py tests/test_redact.py -v

      # Vulnerability scan over the locked dependency set. Strict:
      # any new CVE in a transitive or direct dep fails CI so it surfaces
      # in PR review instead of waiting for the next Dependabot rotation.
      #
      # Ignored CVEs (bobrain does not exercise the vulnerable Pillow code paths):
      # - bobrain does not import PIL / Pillow anywhere (grep src/ → 0 hits)
      # - fastembed 0.5.1 pins pillow<11.0.0 (transitive only, used for image
      #   embedding models; bobrain only uses text embedding via TextEmbedding)
      # - All five CVEs are in image decoding paths (TIFF/PNG/JPEG parsing) that
      #   are never reached when bobrain runs.
      # - Re-evaluate once fastembed upstream fixes model.onnx_data download
      #   (then we can drop the 0.5.1 pin and pull pillow 12.x).
      - name: Audit dependencies
        if: matrix.python-version == '3.13'
        # PYSEC-2025-183: pyjwt 2.12.1 transitive dependency. bobrain does not
        # use JWT verification paths directly; vulnerability is in a code path
        # we don't exercise. Tracked for resolution if a direct JWT consumer is
        # added later.
        run: |
          uv run pip-audit \
            --ignore-vuln CVE-2026-25990 \
            --ignore-vuln CVE-2026-40192 \
            --ignore-vuln CVE-2026-42308 \
            --ignore-vuln CVE-2026-42310 \
            --ignore-vuln CVE-2026-42311 \
            --ignore-vuln CVE-2026-45409 \
            --ignore-vuln PYSEC-2025-183
